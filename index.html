<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="server.js"></script>
    <link rel="icon" href="logo.png" type="image/x-icon" class="favicon">
    <title>Home</title>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo">
        <nav>
            <ul>
                <li><a href="#Hero">Home</a></li>
                <li><a href="#Work">Work</a></li>
                <li><a href="#Timeline">Timeline</a></li>
                <li><a href="#Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="Hero">
            <div class="progress_bar_container">
                <div class="progress_bar"></div>
            </div>
            <div class="title_container">
                <h1>MITCHELL<br>SCHOLTE</h1>
                <p>PORTFOLIO |</p>
            </div>
            <img class="hero_img" alt="Hero Image" src="img/organic_form.png" >
        </section>
        <section id="Work">
            <div class="work-slide">
              <img src="img/new_mockup/cocktail.png" class="clickable-img1">
              <img src="img/new_mockup/gardenCMD.png" class="clickable-img2">
              <img src="img/new_mockup/nao.png" class="clickable-img3">
              <img src="img/new_mockup/mclaren.png" class="clickable-img4">
              <img src="img/new_mockup/mario.png" class="clickable-img5">
            </div>
            <div class="work-slide">
                <img src="img/new_mockup/cocktail.png" class="clickable-img1">
                <img src="img/new_mockup/gardenCMD.png" class="clickable-img2">
                <img src="img/new_mockup/nao.png" class="clickable-img3">
                <img src="img/new_mockup/mclaren.png" class="clickable-img4">
                <img src="img/new_mockup/mario.png" class="clickable-img5">
            </div>
          </section>
          <section id="Contact">
            <form id="contact-form" action="contact_verzoek" method="post">
                <label for="name">Company:</label>
                <input type="text" id="company" name="company" required>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Send</button>
          </section>
    </main>
    <footer></footer>
</body>
</html>
